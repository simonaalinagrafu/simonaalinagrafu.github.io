<!doctype html>
<!--
  Source for public/og.png (1200x630 link-preview card). Regenerate after editing with:
  & "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --disable-gpu `
    --screenshot="<repo>\public\og.png" --window-size=1200,630 --hide-scrollbars "<repo>\design\og-image.html"
  Single-language by design (Romanian, the default locale).
-->
<html lang="ro">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    background: #faf7f2;
    color: #2b2724;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    padding: 0 96px 0 120px;
  }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 22px; background: #7a1f2b; }
  .kicker {
    font-size: 20px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
    color: #7a5f30;
  }
  h1 {
    margin-top: 22px;
    font-family: 'Fraunces', Georgia, serif;
    font-size: 96px;
    font-weight: 600;
    line-height: 1.02;
    letter-spacing: -0.01em;
  }
  .rule { margin-top: 30px; width: 96px; height: 4px; background: #7a1f2b; }
  .site { margin-top: 26px; font-size: 24px; color: #776c62; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div>
    <p class="kicker">Manager de Vânzări · Vânzări B2B · Conducere de echipe</p>
    <h1>Simona Alina Grafu</h1>
    <div class="rule"></div>
    <p class="site">simonaalinagrafu.github.io</p>
  </div>
</body>
</html>
