name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Deliberate override of the placeholder guard in src/data/profile/index.ts:
    # the site ships with imagined stand-in entries (bracketed names) until the
    # real CV arrives. REMOVE this env block once SETUP.md §7 is empty, so the
    # guard protects future edits again.
    env:
      PLACEHOLDERS_OK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Build with Astro
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
